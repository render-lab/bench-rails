services:
  - type: web
    name: bench-rails
    runtime: ruby
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bundle install
    preDeployCommand: bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bench-rails-db
          property: connectionString

databases:
  - name: bench-rails-db
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    ipAllowList: []
