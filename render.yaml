services:
  - type: web
    name: bench-rails-production
    runtime: ruby
    repo: https://github.com/render-lab/bench-rails
    branch: main
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bundle config set --local deployment true && bundle config set --local without 'development test' && bundle install
    startCommand: bundle exec rails server -b 0.0.0.0 -p ${PORT:-10000}
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bench-rails-production-db
          property: connectionString

databases:
  - name: bench-rails-production-db
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: bench_rails_production_db
    user: bench_rails_production_db_user
    diskSizeGB: 1
    ipAllowList: []
